# Core relations, grouped by kind. Each document below is a complete
# `kind: relation` element; `---` separates them. Verbs come from the
# controlled vocabulary in spec/conventions.md, whose scope in v0 is the
# union of every Relation.name declared anywhere along an extends chain
# (see the "Layered base packages" decision, 2026-08-13): a core playbook
# may mint a verb its own descendants can then use, not only core-universal.
# A verb may recur across different entity pairs: relation identity is
# (name, from, to), not name alone (see "Relation identity" in
# spec/conventions.md).
#
# `location` and `shift` are deliberately absent here: they are not
# universal (playbooks/core-operations owns them). `works-at` is absent for
# the same reason; `employed-by` below is its location-free replacement.

kind: relation
name: places
from: customer
to: transaction
cardinality: one-to-many
join: [customer_id, transaction_id]
tier: source-synced
temporal: false
---
kind: relation
name: contains
from: transaction
to: offering
cardinality: many-to-many
join: [transaction_id, offering_id]
tier: source-synced
temporal: false
---
kind: relation
name: supplies
from: supplier
to: offering
cardinality: many-to-many
join: [supplier_id, offering_id]
tier: source-synced
temporal: true
---
kind: relation
name: supplies
from: supplier
to: purchase
cardinality: one-to-many
join: [supplier_id, purchase_id]
tier: source-synced
temporal: false
---
kind: relation
name: billed-to
from: purchase
to: organization
cardinality: many-to-one
join: [purchase_id, organization_id]
tier: source-synced
temporal: false
---
# Every employee is employed by an organization, regardless of vertical.
# `works-at` (a location) is not universal; this is its location-free
# analog, and the one truly universal fact about an employee's employer.
kind: relation
name: employed-by
from: employee
to: organization
cardinality: many-to-one
join: [employee_id, organization_id]
tier: source-synced
temporal: true
---
# An offering belongs to the organization that sells it. Also available
# for a core playbook to reuse on a new pair: playbooks/core-operations
# uses this same verb for location-to-organization.
kind: relation
name: belongs-to
from: offering
to: organization
cardinality: many-to-one
join: [offering_id, organization_id]
tier: source-synced
temporal: false
---
# A refund or adjustment transaction references the original sale it
# corrects.
kind: relation
name: derived-from
from: transaction
to: transaction
cardinality: many-to-one
join: [transaction_id, original_transaction_id]
tier: source-synced
temporal: false
---
# A catalog refresh retires one offering in favor of a direct replacement.
kind: relation
name: supersedes
from: offering
to: offering
cardinality: one-to-one
join: [offering_id, superseded_offering_id]
tier: source-synced
temporal: false
---
# No source feed emits "who owns this customer relationship": an owner
# assigns it by hand, so it sits at client-configured tier even though it
# lives in core-universal.
kind: relation
name: responsible-for
from: employee
to: customer
cardinality: many-to-many
join: [employee_id, customer_id]
tier: client-configured
temporal: true
