name: CI

# Mirrors `make check` exactly (AGENTS.md: "make check is the gate"): this
# workflow's only real job is making sure the tools golangci-lint expects
# are on PATH, then running the same target a developer runs locally. No
# separate lint/test/etc. steps here that could drift from the Makefile.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | \
            sh -s -- -b "$(go env GOPATH)/bin" v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: make check
