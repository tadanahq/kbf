# Demo Bistro & Events' install: the full resolved slot set across its
# closure (core-business's 21 + core-operations' 6 + core-services' 8 =
# 35; bistro-demo adds no new attributes of its own), mapped to two
# fictional sources: demopos (the point-of-sale system, for the walk-in
# side) and demopm (the booking/project tool, for the events side). Demo
# Bistro & Events coordinates individual event deliverables informally
# rather than in a system, so the two delivery.deliverable-due/status
# slots stay unmapped on purpose: `kbf coverage` should show them as the
# gap, a different one than examples/cafe-demo's (crm.customer-*) or
# examples/studio-demo's (purchasing.supplier-*), proof the pattern is
# not hardcoded to one business or one demo.

