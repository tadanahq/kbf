# Demo Bistro & Events calls `engagement` a "booking" or "event" in
# conversation. Under KBF008 (see spec/playbook-format.md), a
# glossary-only override must leave every non-glossary field
# zero-valued: meaning, identity, resolution, tier, attributes and
# states are omitted here on purpose, not repeated. Only `synonyms`
# (Entity's one glossary-eligible field) is set. `engagement` is
# declared in core-services, one of bistro-demo's two immediate composed
# playbooks.

kind: entity
name: engagement
synonyms: {en: [event, booking], es: [evento, reserva]}
