# Two extensions:
# 1. on-time-delivery-rate: a threshold override. Per design.md's
#    "Implementation clarifications" (KBF008), the override leaves every
#    non-glossary field zero-valued: formula, grain, additivity, unit and
#    tier are omitted, not repeated. Only `thresholds` (Metric's one
#    glossary-eligible field) is set, tightened from services-core's 0.85
#    to 0.90: Demo Studio holds itself to a stricter bar.
# 2. repeat-engagement-rate: a net-new vertical metric, not present in
#    services-core or universal-core, so it is declared in full. A classic
#    agency health signal (client loyalty), expressible from customer and
#    engagement counts alone, no attributes beyond what services-core
#    already declares.

kind: metric
name: on-time-delivery-rate
thresholds: {warn-below: 0.90}
---
kind: metric
name: repeat-engagement-rate
formula: count(customer, more-than-one-engagement) / count(customer)
grain: [organization, business-date]
additivity: non-additive
unit: ratio
thresholds: {warn-below: 0.30}
tier: structural
