# Demo Studio's install: the full resolved slot set across its chain
# (core-business's 21 + core-services' 8 = 29; studio-demo adds no new
# attributes of its own), mapped to two fictional sources: demopm (the
# project-management tool) and demobooks (the accounting system). Demo
# Studio has no formal purchasing system yet, so the two purchasing.supplier-*
# slots stay unmapped on purpose: `kbf coverage` should show them as the
# gap, a different one than examples/cafe-demo's (proof the pattern is not
# hardcoded to one business).

