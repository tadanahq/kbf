# Demo Cafe's install: the full resolved slot set across its chain
# (core-universal's 21 + core-operations' 6 = 27; cafe-demo adds no new
# attributes of its own), mapped to two fictional sources: demopos (the
# point-of-sale system) and demobooks (the accounting system). Demo Cafe
# has no CRM yet, so the three crm.* customer slots stay unmapped on
# purpose: `kbf coverage` should show them as the one gap, proof the
# report distinguishes mapped from unmapped rather than reporting a false
# 100%.

- slot: core.organization-legal-name
  source: demobooks
- slot: core.organization-display-name
  source: demobooks
- slot: core.organization-tax-id
  source: demobooks
- slot: sales.transaction-timestamp
