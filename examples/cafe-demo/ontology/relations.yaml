# Demo Cafe operates one location today but wants location groupings
# available before it opens a second one (e.g. a future satellite
# belonging to this flagship). No source system emits that grouping, so
# it is tier: client-configured, not source-synced (see the three-tier
# governance model in spec/conventions.md). This reuses the `belongs-to`
# verb already declared, on other pairs, by both ancestors in this
# package's chain (universal-core's offering-to-organization,
# operations-core's location-to-organization): relation identity is
# (name, from, to), and (belongs-to, location, location) is a distinct
# relation from either of those, so this is a new relation, not a fork.
# `parent_location_id` is a role-qualified alias for location's own
# identity key, the standard shape for a self-referencing join.

kind: relation
name: belongs-to
from: location
to: location
cardinality: many-to-one
join: [location_id, parent_location_id]
tier: client-configured
temporal: false
