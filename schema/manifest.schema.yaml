$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/tadanahq/kbf/main/schema/manifest.schema.yaml
$ref: "#/$defs/Manifest"
$defs:
  Manifest:
    properties:
      name:
        type: string
        description: "Name is the package's identifier, e.g. \"core-universal\". Doubles as its namespace: element uniqueness (KBF003) and fork detection (KBF008) are scoped by this name."
      version:
        type: string
        description: "Version is the package's own version, independent of the spec version it targets (project-standards.md: spec versioning is independent of tool/package versioning)."
      spec:
        type: string
        description: Spec is the KBF spec version this package's content was authored against, e.g. "v0".
      builds-on:
        items:
          type: string
        type: array
        description: "BuildsOn lists the playbook(s) this one composes: zero or more parent names, resolved as a DAG closure (transitive, deduped by name: Universe.Closure), not a single linear chain. Two entries can legitimately share a deeper ancestor (the diamond case: two core playbooks both building on the same root, then a third composing both of them) without that ancestor being loaded twice. Empty means this playbook builds on nothing: for layer: core that is what makes it a root (root-ness is derived from an empty BuildsOn, never declared as its own value); layer: vertical always needs at least one entry (KBF013). Every name must resolve within the set of playbooks passed to `kbf lint`, and the closure must not cycle: both KBF011."
      layer:
        type: string
        description: "Layer states this playbook's place in the taxonomy: core (a foundation playbook other playbooks compose; builds-on only core playbooks, empty allowed) or vertical (a business-specific leaf; builds-on at least one core or vertical playbook, so a vertical may itself be composed by another vertical). This is what makes \"core playbook\" a checkable claim instead of a naming convention nobody enforces: KBF013 cross-checks Layer against BuildsOn (see the rule table in internal/lint/taxonomy.go) and against Name (core playbooks are named \"core-...\", vertical playbooks are not). Layer is a governance-taxonomy field the same way Entity/Metric.Tier is: empty Layer is KBF010, a non-empty value outside Layers is KBF002, and a non-empty, valid value that still doesn't line up with BuildsOn or Name is KBF013."
    additionalProperties: false
    type: object
    required:
    - name
    - version
    - spec
    - builds-on
    - layer
    description: "Manifest is a package's identity card: manifest.yaml at the package root. It names the package, the spec version it targets, and what it builds on. Every package has exactly one manifest; the linter reads it before touching any ontology content, since builds-on drives cross-package resolution (KBF006, KBF007, KBF008)."
  SlotMapping:
    properties:
      slot:
        type: string
        description: Slot is the slot identifier, e.g. "pos.catalog". Referenced by Attribute.Slot elsewhere in the package.
      source:
        type: string
        description: "Source is the source system this slot is mapped to. Empty means declared but not yet mapped: counted as unmapped by `kbf coverage`."
    additionalProperties: false
    type: object
    required:
    - slot
    - source
    description: "SlotMapping is one row of a package's install/slots.yaml: a declared slot and the source system it fills from, if known yet. The file itself is a plain list of these rows (no `kind:` wrapper): static coverage is the share of rows with a non-empty Source. Every attribute Slot reference (model.Attribute.Slot) must name a slot declared here: KBF012."
title: KBF Package Manifest
description: Identity and extension declaration for a KBF package (manifest.yaml).
