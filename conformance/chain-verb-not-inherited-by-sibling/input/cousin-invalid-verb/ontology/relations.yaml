# assembled-from is real (chain-grandparent declares it), but this
# package's only ancestor is chain-other-root, which declares no
# relations at all: illegal here, KBF007 condition (a). Both endpoints
# (gadget, widget) are inherited from chain-other-root, not declared by
# this package, so the owner-adjudicated own-entity minting right
# (condition (b)) does not apply either: this is deliberately the "new
# verb over two fully-inherited entities" shape.
kind: relation
name: assembled-from
from: gadget
to: widget
cardinality: many-to-many
join: [gadget_id, widget_id]
tier: source-synced
temporal: false
