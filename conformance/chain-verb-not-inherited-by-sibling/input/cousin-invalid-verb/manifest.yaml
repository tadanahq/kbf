# Builds on chain-other-root: a genuinely unrelated chain, not
# chain-grandparent's line at all. Declares no entities of its own
# (gadget/widget live in chain-other-root): proves KBF007's composed-verb
# union AND the own-entity minting rule are both scoped to a playbook's
# real ancestors and its own declarations, not to whatever else happens to
# be loaded in the same kbf lint invocation. assembled-from is real (it is
# chain-grandparent's own verb), just not in this playbook's closure.
name: chain-cousin
version: 0.1.0
spec: v0
builds-on: [chain-other-root]
