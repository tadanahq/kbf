# Reuses the parent's `held-at` verb for a new pair (author, branch: an
# author's home branch), distinct from the parent's (book, branch).
# Relation identity is (name, from, to), so a different pair is a new
# relation, not a fork, even though the verb recurs
# (spec/primitives/relation.md).
kind: relation
name: held-at
from: author
to: branch
cardinality: many-to-one
join: [author_id, branch_id]
origin: client-configured
temporal: false
