# Base relations, grouped by kind (design's "grouped files per kind" layout).
# Each document below is a complete `kind: relation` element; `---`
# separates them. Verbs come only from the controlled vocabulary in
# spec/conventions.md. A verb may recur across different entity pairs:
# relation identity is (name, from, to), not name alone (see "Relation
# identity" in spec/conventions.md). Per design.md's "Implementation
# clarifications" (KBF007), the controlled vocabulary IS the set of
# distinct Relation.name values declared here, so all twelve seed verbs
# are used at least once below, not just the ones a minimal graph needs.

kind: relation
name: belongs-to
from: location
to: organization
cardinality: many-to-one
join: [location_id, organization_id]
tier: source-synced
temporal: false
---
kind: relation
name: works-at
from: employee
to: location
cardinality: many-to-one
join: [employee_id, location_id]
tier: source-synced
temporal: true
