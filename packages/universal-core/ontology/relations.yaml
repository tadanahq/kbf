---
# No POS or HR feed emits "who is accountable for this location": an
# owner assigns it by hand, so it sits at client-configured tier even
# though it lives in universal-core. Coexists with `works-at` on the same
# (employee, location) pair without conflict: different verb, different
# relation (a manager is responsible-for a location without necessarily
# clocking works-at shifts there).
kind: relation
name: responsible-for
from: employee
to: location
cardinality: many-to-many
join: [employee_id, location_id]
tier: client-configured
temporal: true
---
# A refund or adjustment order references the original sale it corrects.
kind: relation
name: derived-from
from: order
to: order
cardinality: many-to-one
join: [order_id, original_order_id]
tier: source-synced
temporal: false
---
# A menu refresh retires one product in favor of a direct replacement.
kind: relation
name: supersedes
from: product
to: product
cardinality: one-to-one
join: [product_id, superseded_product_id]
tier: source-synced
temporal: false
