# Universal metrics, grouped by kind. Formula is an opaque expression
# string in v0 (see spec/versioning.md): base metrics aggregate a
# `sum(entity.attribute)` / `count(entity)`, derived metrics reference
# other metric names directly, matching the convention in
# spec/primitives/metric.md.

kind: metric
name: revenue
formula: sum(order.total)
grain: [location, business-date]
additivity: additive
unit: currency
tier: structural
---
kind: metric
name: order-count
formula: count(order)
grain: [location, business-date]
additivity: additive
unit: count
tier: structural
---
kind: metric
name: average-ticket
formula: revenue / order-count
grain: [location, business-date]
additivity: non-additive
unit: currency
tier: structural
---
kind: metric
name: labor-cost-ratio
formula: sum(shift.labor-cost) / revenue
grain: [location, business-date]
additivity: non-additive
unit: ratio
thresholds: {warn-above: 0.35}
tier: structural
---
kind: metric
name: purchase-cost
formula: sum(purchase.total)
grain: [location, business-date]
additivity: additive
unit: currency
tier: structural
---
kind: metric
name: gross-margin
formula: (revenue - purchase-cost) / revenue
grain: [location, business-date]
additivity: non-additive
unit: ratio
thresholds: {warn-below: 0.55}
tier: structural
