kind: entity
name: order
meaning: >-
  A revenue-generating transaction placed by a customer at a location.
identity: [order_id]
resolution: identity-mapping
tier: structural
synonyms: {en: [transaction, sale, ticket], es: [pedido, venta, ticket]}
attributes:
  - {name: placed-at, type: timestamp, slot: sales.order-timestamp}
  - {name: status, type: text, slot: sales.order-status}
  - {name: total, type: currency, slot: sales.order-total}
states: [open, completed, cancelled, refunded]
