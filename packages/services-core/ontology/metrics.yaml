# Thin but real: two metrics that are actually expressible from
# engagement and deliverable alone, without inventing capacity data
# services-core does not have (a true utilization metric needs employee
# available-hours, which is not a field this package can add to
# universal-core's employee without forking it, so it is left out rather
# than faked).

kind: metric
name: effective-rate
formula: revenue / sum(engagement.billed-hours)
grain: [organization, business-date]
additivity: non-additive
unit: currency
tier: structural
---
kind: metric
name: on-time-delivery-rate
formula: count(deliverable, delivered-by-due) / count(deliverable)
grain: [organization, business-date]
additivity: non-additive
unit: ratio
thresholds: {warn-below: 0.85}
tier: structural
